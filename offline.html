<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>برنامج حجز السلف</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f6f8fc;color:#0f172a}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#1d4ed8);padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 28px #0f172a12}.login-card{width:min(430px,100%);padding:28px}.logo{width:64px;height:64px;border-radius:18px;background:#2563eb;color:white;display:grid;place-items:center;font-size:32px;font-weight:900;margin:0 auto 14px}.login h1{text-align:center;margin:0}.muted{color:#64748b}.login p{text-align:center}.field{display:grid;gap:7px;margin:12px 0}.field input,.field select,.field textarea,.filters input,.filters select{border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;outline:none;background:white}.field input:focus,.field textarea:focus,.field select:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:white}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.full{width:100%}.error,.notice{padding:10px;border-radius:10px;margin:10px 0}.error{background:#fee2e2;color:#991b1b}.notice{background:#dcfce7;color:#166534}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0f172a;color:white;padding:18px;display:flex;flex-direction:column;gap:8px}.side h2{margin:4px 0 16px}.nav{border:0;background:transparent;color:#cbd5e1;text-align:right;padding:11px;border-radius:9px;cursor:pointer}.nav:hover,.nav.active{background:#1e293b;color:#fff}.spacer{flex:1}.main{padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:24px}.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{padding:16px}.stat b{display:block;font-size:26px;margin-top:8px}.panel{padding:18px;margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.panel-head h3{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:12px}.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:right;font-size:13px;vertical-align:top}th{background:#f8fafc}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.waiting{background:#dbeafe;color:#1d4ed8}.monthly{background:#dcfce7;color:#166534}.paid{background:#ede9fe;color:#6d28d9}.excluded{background:#fee2e2;color:#991b1b}.empty{text-align:center;color:#94a3b8;padding:24px}.modal-bg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px}.modal{width:min(460px,100%);padding:20px}.modal textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px}.small{font-size:12px}.pager{display:flex;justify-content:center;gap:8px;margin-top:12px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;flex-direction:row;overflow:auto}.side h2{display:none}.spacer{display:none}.main{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.filters{grid-template-columns:1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;gap:10px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card login-card"><div class="logo">س</div><h1>برنامج حجز السلف</h1><p class="muted">نسخة Windows المستقلة 2.1</p><div id="loginErr" class="error hidden"></div><form id="loginForm" action="javascript:void(0)"><div class="field"><label>اسم المستخدم</label><input id="loginUser" value="admin" required></div><div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" required></div><button type="submit" class="btn primary full">تسجيل الدخول</button></form><p class="small muted">الدخول الأول: admin / admin123</p></div></div>
<div id="app" class="shell hidden">
<aside class="side"><h2>حجز السلف</h2><button class="nav active" data-view="dashboard">الرئيسية</button><button class="nav" data-view="new">تسجيل طلب</button><button class="nav" data-view="records">جميع الطلبات</button><button class="nav" data-view="deleted">المحذوفون</button><button class="nav" data-view="users">المستخدمون</button><button class="nav" data-view="settings">الإعدادات</button><div class="spacer"></div><button id="logout" class="nav">تسجيل الخروج</button></aside>
<main class="main"><div class="top"><div><h1 id="title">الرئيسية</h1><div id="who" class="muted small"></div></div><div class="actions"><button id="importBtn" class="btn secondary">استيراد Excel</button><button id="backupBtn" class="btn secondary">نسخة احتياطية</button><button id="restoreBtn" class="btn secondary">استرجاع نسخة</button></div></div><div id="msg"></div><section id="dashboard" class="view"></section><section id="new" class="view hidden"></section><section id="records" class="view hidden"></section><section id="deleted" class="view hidden"></section><section id="users" class="view hidden"></section><section id="settings" class="view hidden"></section></main>
</div>
<div id="modal" class="modal-bg hidden"><div class="card modal"><h3 id="modalTitle">سبب الحذف</h3><textarea id="deleteReason" rows="4" placeholder="اكتب سبب الحذف..."></textarea><div class="actions" style="justify-content:flex-end;margin-top:12px"><button id="cancelModal" class="btn secondary">إلغاء</button><button id="confirmDelete" class="btn danger">تأكيد الحذف</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const api=(a,p={})=>window.loanAPI.call(a,p);let currentUser=null,deleteId=null,editId=null,recordPage=0,deletedPage=0;
const labels={waiting:'قائمة الانتظار',monthly:'مشمول بالحصة الشهرية',paid:'تم الصرف',excluded:'مستبعد'};
const money=n=>new Intl.NumberFormat('ar-IQ').format(Number(n||0))+' د.ع';const dt=v=>new Intl.DateTimeFormat('ar-IQ',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v));
function message(t,type='notice'){$('msg').innerHTML=t?`<div class="${type}">${t}</div>`:''}
function show(view){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));const target=$(view);if(target)target.classList.remove('hidden');document.querySelectorAll('.nav[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));$('title').textContent={dashboard:'الرئيسية',new:editId?'تعديل الطلب':'تسجيل طلب',records:'جميع الطلبات',deleted:'المحذوفون',users:'المستخدمون',settings:'الإعدادات'}[view]||'برنامج حجز السلف';message('');if(view==='dashboard')loadDashboard();if(view==='new')renderForm();if(view==='records')loadRecords();if(view==='deleted')loadDeleted();if(view==='users')loadUsers();if(view==='settings')loadSettings();}
function badge(s){return `<span class="badge ${s}">${labels[s]||s}</span>`}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginErr').classList.add('hidden');try{const r=await api('login',{username:$('loginUser').value,password:$('loginPass').value});if(!r.ok){$('loginErr').textContent=r.error||'تعذر تسجيل الدخول';$('loginErr').classList.remove('hidden');return}currentUser=r.user;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${r.user.name} - ${r.user.role==='admin'?'مسؤول':'موظف'}`;await loadDashboard();showOnly('dashboard');}catch(err){$('loginErr').textContent='حدث خطأ أثناء فتح النظام: '+(err?.message||err);$('loginErr').classList.remove('hidden')}});
function showOnly(view){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));const target=$(view);if(target)target.classList.remove('hidden');document.querySelectorAll('.nav[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));$('title').textContent={dashboard:'الرئيسية',new:editId?'تعديل الطلب':'تسجيل طلب',records:'جميع الطلبات',deleted:'المحذوفون',users:'المستخدمون',settings:'الإعدادات'}[view]||'برنامج حجز السلف';}
document.querySelectorAll('.nav[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));$('logout').onclick=async()=>{await api('logout');location.reload()};
async function loadDashboard(){const r=await api('dashboard',{limit:25});if(!r.ok)throw new Error(r.error||'تعذر تحميل الرئيسية');$('dashboard').innerHTML=`<div class="stats"><div class="card stat"><span>إجمالي الطلبات</span><b>${r.stats.total}</b></div><div class="card stat"><span>الانتظار</span><b>${r.stats.waiting}</b></div><div class="card stat"><span>الحصة الشهرية</span><b>${r.stats.monthly}</b></div><div class="card stat"><span>تم الصرف</span><b>${r.stats.paid}</b></div><div class="card stat"><span>المستبعدون</span><b>${r.stats.excluded}</b></div><div class="card stat"><span>المحذوفون</span><b>${r.stats.deleted}</b></div></div>${queue('قائمة الانتظار',r.waiting)}${queue('المشمولون بالحصة الشهرية',r.monthly)}`}
function queue(title,rows){return `<div class="card panel"><div class="panel-head"><h3>${title}</h3><span class="muted">يعرض أول 25 طلب</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>الاسم</th><th>المبلغ</th><th>التسجيل</th><th>بواسطة</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${money(x.amount)}</td><td>${dt(x.createdAt)}</td><td>${esc(x.registeredByName)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد طلبات</td></tr>'}</tbody></table></div></div>`}
async function renderForm(){let x={name:'',phone:'',nationalId:'',amount:0,notes:'',status:'waiting'};if(editId){const r=await api('loan_get',{id:editId});if(r.ok)x=r.loan}else{const s=await api('settings_get');if(s.ok)x.amount=s.settings.defaultLoanAmount||0}$('new').innerHTML=`<div class="card panel"><h3>${editId?'تعديل طلب':'تسجيل طلب جديد'}</h3><form id="loanForm" class="form-grid"><div class="field"><label>الاسم الكامل *</label><input id="fName" value="${escAttr(x.name)}" required></div><div class="field"><label>رقم الهاتف</label><input id="fPhone" value="${escAttr(x.phone)}"></div><div class="field"><label>الرقم الوطني / الوظيفي</label><input id="fNat" value="${escAttr(x.nationalId)}"></div><div class="field"><label>مبلغ السلفة</label><input id="fAmount" type="number" min="0" value="${Number(x.amount||0)}"></div><div class="field"><label>الحالة</label><select id="fStatus">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field wide"><label>الملاحظات</label><textarea id="fNotes" rows="5">${esc(x.notes)}</textarea></div><div class="wide actions"><button class="btn primary">حفظ الطلب</button><button type="button" id="cancelEdit" class="btn secondary">إلغاء</button></div></form></div>`;$('loanForm').onsubmit=saveLoan;$('cancelEdit').onclick=()=>{editId=null;show('records')}}
async function saveLoan(e){e.preventDefault();const data={name:$('fName').value,phone:$('fPhone').value,nationalId:$('fNat').value,amount:Number($('fAmount').value),notes:$('fNotes').value,status:$('fStatus').value};const r=await api(editId?'loan_update':'loan_create',{...data,id:editId});if(!r.ok)return message(r.error,'error');editId=null;show('records')}
async function loadRecords(){const r=await api('loans_list',{pageSize:25,page:recordPage});if(!r.ok)return message(r.error,'error');$('records').innerHTML=`<div class="card panel"><div class="panel-head"><h3>الطلبات</h3><span>الصفحة ${recordPage+1}</span></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>المبلغ</th><th>الحالة</th><th>التسجيل</th><th>الملاحظات</th><th>إجراءات</th></tr></thead><tbody>${r.items.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="small muted">${esc(x.phone||x.nationalId)}</div></td><td>${money(x.amount)}</td><td>${badge(x.status)}</td><td>${dt(x.createdAt)}<div class="small muted">${esc(x.registeredByName)}</div></td><td>${esc(x.notes||'-')}</td><td><div class="actions"><button class="btn secondary" onclick="editLoan('${x.id}')">تعديل</button><button class="btn danger" onclick="askDelete('${x.id}','${escAttr(x.name)}')">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد بيانات</td></tr>'}</tbody></table></div><div class="pager"><button class="btn secondary" ${recordPage===0?'disabled':''} onclick="recordPage--;loadRecords()">السابق</button><button class="btn secondary" ${r.items.length<25?'disabled':''} onclick="recordPage++;loadRecords()">التالي</button></div></div>`}
window.editLoan=id=>{editId=id;show('new')};window.askDelete=(id,name)=>{deleteId=id;$('modalTitle').textContent='حذف '+name;$('deleteReason').value='';$('modal').classList.remove('hidden')};$('cancelModal').onclick=()=>$('modal').classList.add('hidden');$('confirmDelete').onclick=async()=>{const r=await api('loan_delete',{id:deleteId,reason:$('deleteReason').value});if(!r.ok)return alert(r.error);$('modal').classList.add('hidden');loadRecords()};
async function loadDeleted(){const r=await api('deleted_list',{pageSize:25,page:deletedPage});if(!r.ok)return message(r.error,'error');$('deleted').innerHTML=`<div class="card panel"><div class="panel-head"><h3>قائمة المحذوفين</h3><span>الصفحة ${deletedPage+1}</span></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>سبب الحذف</th><th>وقت الحذف</th><th>حذف بواسطة</th><th>إجراء</th></tr></thead><tbody>${r.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.deletionReason)}</td><td>${dt(x.deletedAt)}</td><td>${esc(x.deletedByName)}</td><td><button class="btn success" onclick="restoreDeleted('${x.id}')">استرجاع</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد أسماء محذوفة</td></tr>'}</tbody></table></div><div class="pager"><button class="btn secondary" ${deletedPage===0?'disabled':''} onclick="deletedPage--;loadDeleted()">السابق</button><button class="btn secondary" ${r.items.length<25?'disabled':''} onclick="deletedPage++;loadDeleted()">التالي</button></div></div>`}
window.restoreDeleted=async id=>{const r=await api('deleted_restore',{id});if(!r.ok)return alert(r.error);loadDeleted()};
async function loadUsers(){const r=await api('users_list');if(!r.ok){$('users').innerHTML='<div class="error">هذه الصفحة للمسؤول فقط</div>';return}$('users').innerHTML=`<div class="card panel"><h3>إضافة مستخدم</h3><form id="userForm" class="form-grid"><div class="field"><label>اسم المستخدم</label><input id="uUser" required></div><div class="field"><label>الاسم الظاهر</label><input id="uName" required></div><div class="field"><label>كلمة المرور</label><input id="uPass" type="password" required></div><div class="field"><label>الصلاحية</label><select id="uRole"><option value="employee">موظف</option><option value="admin">مسؤول</option></select></div><div class="wide"><button class="btn primary">إضافة</button></div></form></div><div class="card panel"><h3>المستخدمون</h3><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>المستخدم</th><th>الصلاحية</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${r.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role==='admin'?'مسؤول':'موظف'}</td><td>${u.active?'فعال':'موقوف'}</td><td><button class="btn secondary" onclick="toggleUser('${u.id}',${!u.active})">${u.active?'إيقاف':'تفعيل'}</button></td></tr>`).join('')}</tbody></table></div></div>`;$('userForm').onsubmit=async e=>{e.preventDefault();const x=await api('user_create',{username:$('uUser').value,name:$('uName').value,password:$('uPass').value,role:$('uRole').value});if(!x.ok)return alert(x.error);loadUsers()}}
window.toggleUser=async(id,active)=>{const r=await api('user_toggle',{id,active});if(!r.ok)return alert(r.error);loadUsers()};
async function loadSettings(){const r=await api('settings_get');if(!r.ok)return message(r.error,'error');$('settings').innerHTML=`<div class="card panel"><h3>إعدادات النظام</h3><form id="settingsForm"><div class="field" style="max-width:420px"><label>مبلغ السلفة الافتراضي</label><input id="defaultAmount" type="number" min="0" value="${r.settings.defaultLoanAmount||0}"></div><button class="btn primary">حفظ</button></form></div>`;$('settingsForm').onsubmit=async e=>{e.preventDefault();const x=await api('settings_save',{defaultLoanAmount:Number($('defaultAmount').value)});if(!x.ok)return alert(x.error);message('تم حفظ الإعدادات')}}
$('importBtn').onclick=async()=>{const r=await api('import_excel');if(r.ok){alert(`تم استيراد ${r.imported} اسماً`);show('records')}};$('backupBtn').onclick=async()=>{const r=await api('backup');if(r.ok)alert('تم إنشاء النسخة الاحتياطية')};$('restoreBtn').onclick=async()=>{if(!confirm('سيتم استبدال بيانات البرنامج الحالية. هل تريد المتابعة؟'))return;const r=await api('restore_backup');if(r.ok)location.reload();else if(!r.canceled)alert(r.error)};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(s){return esc(s).replace(/`/g,'&#96;')}
window.addEventListener('error',e=>{console.error(e.error||e.message)});window.addEventListener('unhandledrejection',e=>{console.error(e.reason)});
</script>
</body></html>
